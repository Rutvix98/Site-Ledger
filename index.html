<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>SiteLedger — Construction &amp; Shop Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============ THEME TOKENS ============ */
:root{
  --font-display:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-xl:22px;
  --shadow-sm:0 1px 2px rgba(20,16,10,.06);
  --shadow-md:0 6px 20px -6px rgba(20,16,10,.18);
  --shadow-lg:0 18px 46px -14px rgba(20,16,10,.30);
  --sidebar-w:236px; --sidebar-w-collapsed:76px;
}
[data-theme="construction-orange"]{
  --bg:#15130f; --surface:#1c1a15; --surface-2:#23201a; --surface-raised:#28241d; --border:#33301e40;
  --border-solid:#38332a; --ink:#f3efe6; --ink-muted:#b6ac97; --ink-faint:#7a7261;
  --accent:#ef7d1a; --accent-ink:#1a1208; --accent-hover:#ff8f2e; --accent-soft:rgba(239,125,26,.15);
  --success:#4fb56a; --success-soft:rgba(79,181,106,.15); --warning:#e0a72b; --warning-soft:rgba(224,167,43,.16);
  --danger:#e5595a; --danger-soft:rgba(229,89,90,.15); --info:#4f9fd6; --info-soft:rgba(79,159,214,.15);
  --stripe-a:#ef7d1a; --stripe-b:#1c1a15;
}
[data-theme="dark"]{
  --bg:#111317; --surface:#181b20; --surface-2:#1e2127; --surface-raised:#22262d; --border:#2a2e3640;
  --border-solid:#2c3038; --ink:#eef0f3; --ink-muted:#9aa2b0; --ink-faint:#5c6270;
  --accent:#6c8cff; --accent-ink:#0c1020; --accent-hover:#8199ff; --accent-soft:rgba(108,140,255,.16);
  --success:#3fbb78; --success-soft:rgba(63,187,120,.15); --warning:#e0a72b; --warning-soft:rgba(224,167,43,.16);
  --danger:#ef5a5a; --danger-soft:rgba(239,90,90,.15); --info:#4fb2e0; --info-soft:rgba(79,178,224,.15);
  --stripe-a:#6c8cff; --stripe-b:#181b20;
}
[data-theme="light"]{
  --bg:#f4f2ec; --surface:#ffffff; --surface-2:#faf8f3; --surface-raised:#ffffff; --border:#e5e0d3;
  --border-solid:#e5e0d3; --ink:#211d15; --ink-muted:#716a58; --ink-faint:#a49c88;
  --accent:#c2660a; --accent-ink:#fff7ef; --accent-hover:#a8560a; --accent-soft:rgba(194,102,10,.1);
  --success:#1f8a4c; --success-soft:rgba(31,138,76,.1); --warning:#b5790f; --warning-soft:rgba(181,121,15,.12);
  --danger:#c13f3f; --danger-soft:rgba(193,63,63,.1); --info:#1f6fa8; --info-soft:rgba(31,111,168,.1);
  --stripe-a:#c2660a; --stripe-b:#ffffff; --shadow-md:0 6px 20px -8px rgba(60,50,20,.14); --shadow-lg:0 18px 40px -14px rgba(60,50,20,.20);
}
[data-theme="forest-green"]{
  --bg:#0e1410; --surface:#141b15; --surface-2:#19221a; --surface-raised:#1d271e; --border:#26301f60;
  --border-solid:#293323; --ink:#e9efe6; --ink-muted:#9bb090; --ink-faint:#5c6b52;
  --accent:#54a866; --accent-ink:#08130a; --accent-hover:#67c17a; --accent-soft:rgba(84,168,102,.16);
  --success:#54a866; --success-soft:rgba(84,168,102,.15); --warning:#d3a13a; --warning-soft:rgba(211,161,58,.15);
  --danger:#d1615c; --danger-soft:rgba(209,97,92,.15); --info:#4fa3a8; --info-soft:rgba(79,163,168,.15);
  --stripe-a:#54a866; --stripe-b:#141b15;
}
[data-theme="slate-blue"]{
  --bg:#171b23; --surface:#1d222c; --surface-2:#232935; --surface-raised:#282f3c; --border:#333c4d60;
  --border-solid:#333c4d; --ink:#e8ebf1; --ink-muted:#9aa5ba; --ink-faint:#5c6579;
  --accent:#7d8fce; --accent-ink:#0f1220; --accent-hover:#93a3db; --accent-soft:rgba(125,143,206,.16);
  --success:#4fae7c; --success-soft:rgba(79,174,124,.15); --warning:#d1a23f; --warning-soft:rgba(209,162,63,.15);
  --danger:#d16a68; --danger-soft:rgba(209,106,104,.15); --info:#6fa8d1; --info-soft:rgba(111,168,209,.15);
  --stripe-a:#7d8fce; --stripe-b:#1d222c;
}
[data-theme="midnight"]{
  --bg:#070a12; --surface:#0c1120; --surface-2:#101729; --surface-raised:#131b30; --border:#1c2740a0;
  --border-solid:#1c2740; --ink:#e6eaf5; --ink-muted:#8994b3; --ink-faint:#4c5674;
  --accent:#5c7cfa; --accent-ink:#060916; --accent-hover:#7891fb; --accent-soft:rgba(92,124,250,.18);
  --success:#3fb480; --success-soft:rgba(63,180,128,.15); --warning:#dba635; --warning-soft:rgba(219,166,53,.15);
  --danger:#ea5c68; --danger-soft:rgba(234,92,104,.15); --info:#4ea3e0; --info-soft:rgba(78,163,224,.15);
  --stripe-a:#5c7cfa; --stripe-b:#0c1120;
}

/* ============ RESET & BASE ============ */
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; transition:background .2s ease,color .2s ease;
}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-.01em;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-solid); border-radius:20px;}
::-webkit-scrollbar-track{background:transparent;}
*:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

/* ============ SPLASH ============ */
.splash{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:16px; transition:opacity .4s ease, visibility .4s ease;}
.splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
.splash-logo{width:64px; height:64px; animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.08); opacity:.75;}}
.splash-text{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink-muted); letter-spacing:.02em;}

/* ============ APP SHELL ============ */
.app{display:flex; height:100vh; overflow:hidden;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--surface); border-right:1px solid var(--border-solid);
  display:flex; flex-direction:column; transition:width .22s ease; position:relative; z-index:20;
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.brand-row{display:flex; align-items:center; gap:11px; padding:18px 16px; border-bottom:1px solid var(--border);}
.logo-badge{width:38px; height:38px; flex-shrink:0; border-radius:11px; overflow:hidden; box-shadow:var(--shadow-sm);}
.brand-text{overflow:hidden; white-space:nowrap; opacity:1; transition:opacity .15s ease;}
.sidebar.collapsed .brand-text{opacity:0; width:0;}
.brand-app{font-family:var(--font-display); font-weight:800; font-size:14.5px; letter-spacing:-.01em;}
.brand-owner{font-size:11px; color:var(--ink-muted); margin-top:1px;}
.editable{cursor:text; border-radius:4px; padding:0 3px; margin:0 -3px; outline:1px solid transparent;}
.editable:hover{background:var(--surface-2);}
.editable:focus{outline:1px solid var(--accent); background:var(--surface-2);}

.collapse-btn{
  position:absolute; top:22px; right:-12px; width:24px; height:24px; border-radius:50%; background:var(--surface-raised);
  border:1px solid var(--border-solid); color:var(--ink-muted); display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:var(--shadow-sm); z-index:5; transition:transform .2s ease, color .15s;
}
.collapse-btn:hover{color:var(--accent);}
.sidebar.collapsed .collapse-btn svg{transform:rotate(180deg);}

.nav{flex:1; overflow-y:auto; padding:12px 10px; display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:10px; cursor:pointer;
  color:var(--ink-muted); font-size:13.5px; font-weight:600; transition:background .15s,color .15s; white-space:nowrap; overflow:hidden;
  position:relative;
}
.nav-item svg{flex-shrink:0; width:18px; height:18px;}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent);}
.sidebar.collapsed .nav-item{justify-content:center; padding:11px;}
.sidebar.collapsed .nav-item span.label{display:none;}
.nav-item .badge{margin-left:auto; background:var(--danger); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:20px;}
.sidebar.collapsed .nav-item .badge{display:none;}

.sidebar-foot{padding:14px 16px; border-top:1px solid var(--border); font-size:10.5px; color:var(--ink-faint); white-space:nowrap; overflow:hidden;}
.sidebar.collapsed .sidebar-foot{opacity:0;}

.main{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden;}
.topbar{
  display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid var(--border-solid);
  background:var(--bg); flex-shrink:0;
}
.hamburger{display:none; width:36px; height:36px; border-radius:9px; border:1px solid var(--border-solid); background:var(--surface); align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0;}
.search-wrap{flex:1; max-width:420px; position:relative;}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-faint); width:16px; height:16px;}
.search{
  width:100%; padding:9px 14px 9px 36px; border-radius:10px; border:1px solid var(--border-solid); background:var(--surface);
  color:var(--ink); font-size:13.5px; transition:border-color .15s, box-shadow .15s;
}
.search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none;}
.search-results{position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--surface-raised); border:1px solid var(--border-solid); border-radius:12px; box-shadow:var(--shadow-lg); max-height:380px; overflow-y:auto; z-index:60; display:none;}
.search-results.show{display:block;}
.sr-group-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:10px 14px 4px;}
.sr-item{display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; font-size:13px;}
.sr-item:hover{background:var(--surface-2);}
.sr-empty{padding:22px; text-align:center; color:var(--ink-faint); font-size:13px;}

.topbar-right{display:flex; align-items:center; gap:10px; margin-left:auto;}
.theme-picker{display:flex; gap:6px; padding:4px; background:var(--surface); border:1px solid var(--border-solid); border-radius:12px;}
.theme-dot{width:20px; height:20px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .12s, border-color .15s; flex-shrink:0;}
.theme-dot:hover{transform:scale(1.12);}
.theme-dot.active{border-color:var(--ink);}
.icon-btn{width:36px; height:36px; border-radius:10px; border:1px solid var(--border-solid); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-muted); transition:color .15s, background .15s;}
.icon-btn:hover{color:var(--accent); background:var(--surface-2);}

.content{flex:1; overflow-y:auto; padding:24px 26px 90px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.page-title{font-size:21px; font-weight:800;}
.page-sub{font-size:12.5px; color:var(--ink-muted); margin-top:3px;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:10px; border:1px solid transparent;
  font-size:13px; font-weight:700; cursor:pointer; transition:transform .1s ease, filter .15s, background .15s, box-shadow .15s;
  white-space:nowrap; font-family:var(--font-body);
}
.btn:active{transform:scale(.97);}
.btn svg{width:15px; height:15px; flex-shrink:0;}
.btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 14px -4px var(--accent-soft);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--surface); color:var(--ink); border-color:var(--border-solid);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-danger:hover{filter:brightness(1.12);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
.btn-block{width:100%; justify-content:center;}
.btn-icon{padding:8px; border-radius:9px;}

/* ============ STAT CARDS ============ */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.stat-card{
  background:var(--surface); border:1px solid var(--border-solid); border-radius:var(--radius-lg); padding:18px;
  box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease; position:relative; overflow:hidden;
}
.stat-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
.stat-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.stat-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;}
.stat-icon svg{width:17px; height:17px;}
.stat-val{font-family:var(--font-display); font-size:23px; font-weight:800; line-height:1;}
.stat-label{font-size:12px; color:var(--ink-muted); margin-top:6px; font-weight:600;}
.stat-trend{font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px;}
.trend-up{color:var(--success); background:var(--success-soft);}
.trend-down{color:var(--danger); background:var(--danger-soft);}
.trend-flat{color:var(--ink-faint); background:var(--surface-2);}

.dash-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:16px;}
@media (max-width:1080px){.dash-grid{grid-template-columns:1fr;}}

/* ============ CARDS / PANELS ============ */
.panel{background:var(--surface); border:1px solid var(--border-solid); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-sm);}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.panel-title{font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
.panel-title svg{width:16px; height:16px; color:var(--accent);}

.activity-row{display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--border);}
.activity-row:last-child{border-bottom:none; padding-bottom:0;}
.activity-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:5px; flex-shrink:0;}
.activity-text{font-size:12.5px; line-height:1.5;}
.activity-time{font-size:10.5px; color:var(--ink-faint); margin-top:1px;}

/* ============ TOOLBAR / FILTERS ============ */
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
.chip{padding:7px 14px; border-radius:20px; background:var(--surface); border:1px solid var(--border-solid); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-muted); transition:all .15s; white-space:nowrap;}
.chip:hover{color:var(--ink);}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.seg-toggle{display:flex; border:1px solid var(--border-solid); border-radius:var(--radius-md); overflow:hidden;}
.seg-opt{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 8px; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink-muted); background:var(--surface); transition:all .15s;}
.seg-opt svg{width:15px; height:15px;}
.seg-opt+.seg-opt{border-left:1px solid var(--border-solid);}
.seg-opt.active{background:var(--success-soft); color:var(--success);}
.seg-opt.active svg{color:var(--success);}
.seg-toggle .seg-opt[data-val="unpaid"].active{background:var(--danger-soft); color:var(--danger);}
.input,.select,.textarea{
  width:100%; padding:9px 13px; border-radius:9px; border:1px solid var(--border-solid); background:var(--surface);
  color:var(--ink); font-size:13px; font-family:inherit; transition:border-color .15s, box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none;}
.textarea{resize:vertical; min-height:64px;}
.form-field{display:flex; flex-direction:column; gap:5px; margin-bottom:13px;}
.form-field span{font-size:11.5px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
@media(max-width:520px){.form-row,.form-row3{grid-template-columns:1fr;}}

/* ============ GRID OF ENTITY CARDS ============ */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
.entity-card{
  background:var(--surface); border:1px solid var(--border-solid); border-radius:var(--radius-lg); padding:16px; cursor:pointer;
  box-shadow:var(--shadow-sm); transition:transform .15s, box-shadow .15s; display:flex; flex-direction:column; gap:10px; position:relative;
}
.entity-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--accent);}
.product-thumb{width:100%; height:110px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--ink-faint);}
.product-thumb img{width:100%; height:100%; object-fit:cover;}
.entity-title{font-weight:700; font-size:13.5px;}
.entity-sub{font-size:11.5px; color:var(--ink-muted);}
.tag{display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700; background:var(--surface-2); color:var(--ink-muted); width:fit-content;}
.tag-accent{background:var(--accent-soft); color:var(--accent);}
.tag-danger{background:var(--danger-soft); color:var(--danger);}
.tag-success{background:var(--success-soft); color:var(--success);}
.tag-warn{background:var(--warning-soft); color:var(--warning);}
.card-price-row{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
.card-price{font-family:var(--font-mono); font-weight:700; font-size:14px;}
.stock-pill{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;}

/* ============ PROGRESS ============ */
.progress-track{width:100%; height:9px; border-radius:20px; background:var(--surface-2); overflow:hidden;}
.progress-fill{height:100%; border-radius:20px; background:linear-gradient(90deg,var(--accent),var(--accent-hover)); transition:width .5s ease;}

/* ============ TABLES (compact, non-boring) ============ */
.tbl{width:100%; border-collapse:collapse; font-size:12.5px;}
.tbl th{text-align:left; padding:9px 12px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; font-size:10.5px; letter-spacing:.04em; border-bottom:1px solid var(--border-solid);}
.tbl td{padding:11px 12px; border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--surface-2);}

/* ============ EMPTY STATE ============ */
.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:56px 20px; color:var(--ink-muted);}
.empty-state svg{width:52px; height:52px; color:var(--ink-faint); margin-bottom:14px;}
.empty-state h3{font-size:15px; margin-bottom:5px; color:var(--ink);}
.empty-state p{font-size:12.5px; max-width:320px; margin:0 0 16px;}

/* ============ MODAL ============ */
.modal-backdrop{position:fixed; inset:0; background:rgba(10,8,4,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:200; opacity:0; visibility:hidden; transition:opacity .2s ease, visibility .2s ease; padding:20px;}
.modal-backdrop.show{opacity:1; visibility:visible;}
.modal{background:var(--surface-raised); border:1px solid var(--border-solid); border-radius:var(--radius-lg); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); transform:translateY(14px) scale(.98); transition:transform .22s cubic-bezier(.2,.9,.3,1.2);}
.modal-backdrop.show .modal{transform:translateY(0) scale(1);}
.modal.wide{max-width:760px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);}
.modal-title{font-size:15.5px; font-weight:800;}
.modal-body{padding:20px;}
.modal-foot{display:flex; justify-content:flex-end; gap:9px; padding:16px 20px; border-top:1px solid var(--border);}
.close-x{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-muted); background:transparent; border:none;}
.close-x:hover{background:var(--surface-2); color:var(--ink);}

.confirm-icon{width:48px; height:48px; border-radius:50%; background:var(--danger-soft); color:var(--danger); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}

.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px; margin-top:8px;}
.photo-thumb{position:relative; aspect-ratio:1; border-radius:9px; overflow:hidden; background:var(--surface-2); cursor:pointer;}
.photo-thumb img{width:100%; height:100%; object-fit:cover;}
.photo-thumb .rm{position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer;}
.photo-add{aspect-ratio:1; border-radius:9px; border:1.5px dashed var(--border-solid); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); cursor:pointer; flex-direction:column; gap:2px; font-size:10px;}
.photo-add:hover{border-color:var(--accent); color:var(--accent);}
#logPhotoGrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
.photo-thumb-desc .photo-thumb{aspect-ratio:4/3;}
.lightbox-img{width:100%; border-radius:10px; max-height:60vh; object-fit:contain; background:var(--surface-2);}

/* ============ LEDGER LIST ============ */
.list-row{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.list-avatar{width:34px; height:34px; border-radius:9px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0;}

/* ============ FAB (mobile) ============ */
.fab{display:none; position:fixed; bottom:24px; right:20px; width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink); align-items:center; justify-content:center; box-shadow:0 10px 26px -6px rgba(0,0,0,.4); border:none; cursor:pointer; z-index:60;}
.fab svg{width:24px; height:24px;}

/* ============ TOAST ============ */
.toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{background:var(--surface-raised); border:1px solid var(--border-solid); color:var(--ink); padding:11px 18px; border-radius:11px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:9px; animation:toastIn .25s ease;}
.toast svg{width:15px; height:15px; color:var(--success); flex-shrink:0;}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ============ CHARTS ============ */
.chart-wrap{width:100%; overflow-x:auto;}
canvas.chart-canvas{width:100%; display:block;}
.legend-row{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-muted); margin-top:8px; flex-wrap:wrap;}
.legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.rank-row{display:flex; align-items:center; gap:10px; padding:8px 0;}
.rank-num{width:20px; height:20px; border-radius:6px; background:var(--surface-2); color:var(--ink-muted); font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.rank-bar-track{flex:1; height:6px; border-radius:20px; background:var(--surface-2); overflow:hidden;}
.rank-bar-fill{height:100%; background:var(--accent); border-radius:20px;}

/* ============ SETTINGS ============ */
.settings-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px; max-width:520px;}
.theme-tile{border-radius:12px; padding:12px 10px; border:2px solid var(--border-solid); cursor:pointer; text-align:center; font-size:10.5px; font-weight:700; transition:border-color .15s;}
.theme-tile.active{border-color:var(--accent);}
.theme-tile-swatch{width:100%; height:36px; border-radius:8px; margin-bottom:8px;}

/* ============ INVOICE ============ */
.invoice-sheet{background:#fff; color:#161616; border-radius:12px; padding:28px; font-family:var(--font-body);}
.invoice-sheet .inv-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #161616; padding-bottom:14px; margin-bottom:16px;}
.invoice-sheet table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
.invoice-sheet th{text-align:left; border-bottom:1.5px solid #161616; padding:7px 4px; font-size:10.5px; text-transform:uppercase;}
.invoice-sheet td{padding:8px 4px; border-bottom:1px solid #ddd;}

/* ============ RESPONSIVE ============ */
.overlay-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:19;}
@media (max-width:900px){
  .sidebar{position:fixed; inset:0 auto 0 0; transform:translateX(-100%); width:250px !important; box-shadow:var(--shadow-lg);}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.mobile-open ~ .overlay-scrim{display:block;}
  .sidebar .brand-text{opacity:1 !important; width:auto !important;}
  .sidebar .nav-item span.label{display:inline !important;}
  .sidebar.collapsed{width:250px;}
  .collapse-btn{display:none;}
  .hamburger{display:flex;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .search-wrap{max-width:none;}
  .content{padding:16px 14px 100px;}
  .fab{display:flex;}
  .topbar{padding:12px 14px;}
  .modal{max-width:calc(100vw - 24px);}
  .form-row,.form-row3{grid-template-columns:1fr;}
}
@media (max-width:520px){.stat-grid{grid-template-columns:1fr 1fr;}}
</style>

  try{
    const raw = localStorage.getItem(STORE_KEY);

    const parsed = JSON.parse(raw);

      settings: Object.assign({}, DEFAULT_STATE.settings, parsed.settings||{})

function handleCategorySelectChange(catSel, onDone){
  if(catSel.value==="__addcat__"){
    const name = (prompt("New category name:")||"").trim();
    if(name){
      if(!state.categories[name]) state.categories[name] = [];
      saveState();
      catSel.innerHTML = categoryOptionsHtml(name);
      toast(`Category "${name}" added`);
    } else {
      catSel.innerHTML = categoryOptionsHtml(Object.keys(state.categories)[0]);
    }
  }
  onDone();
}
function handleSubcategorySelectChange(subSel, cat, onDone){
  if(subSel.value==="__addsub__"){
    const name = (prompt(`New subcategory for "${cat}":`)||"").trim();
    if(name){
      state.categories[cat] = state.categories[cat]||[];
      if(!state.categories[cat].includes(name)) state.categories[cat].push(name);
      saveState();
      subSel.innerHTML = subcategoryOptionsHtml(cat, name);
      toast(`Subcategory "${name}" added`);
    } else {
      subSel.innerHTML = subcategoryOptionsHtml(cat, (state.categories[cat]||[])[0]);
    }
  }
  if(onDone) onDone();
}

/* ============== DASHBOARD ============== */
function computeTotals(){
  const revenue = state.transactions.filter(t=>t.type==="revenue").reduce((s,t)=>s+Number(t.amount),0);
  const expenses = state.transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount),0);
  const profit = revenue - expenses;
  const inventoryValue = state.products.reduce((s,p)=>s+Number(p.stock)*Number(p.sellingPrice||0),0);
  const pending = state.customers.reduce((s,c)=>s+Number(c.pending||0),0);
  const lowStock = state.products.filter(p=>Number(p.stock)<=Number(p.lowStock||0));
  const activeSites = state.sites.filter(s=>Number(s.progress||0) < 100).length;
  const workersToday = state.workers.filter(w=> (w.attendance||[]).some(a=>a.date===todayStr() && a.present)).length;
  return {revenue, expenses, profit, inventoryValue, pending, lowStock, activeSites, workersToday};
}
function renderDashboard(){
  const t = computeTotals();
  const cards = [
    {label:"Total Revenue", val:money(t.revenue), icon:"rupee", tone:"success"},
    {label:"Total Expenses", val:money(t.expenses), icon:"finance", tone:"danger"},
    {label:"Estimated Profit", val:money(t.profit), icon:"profit", tone: t.profit>=0?"success":"danger"},
    {label:"Inventory Value", val:money(t.inventoryValue), icon:"warehouse", tone:"info"},
    {label:"Total Customers", val:state.customers.length, icon:"customers", tone:"accent"},
    {label:"Total Suppliers", val:state.suppliers.length, icon:"suppliers", tone:"accent"},
    {label:"Active Construction Sites", val:t.activeSites, icon:"crane", tone:"warn"},
    {label:"Workers Today", val:t.workersToday+" / "+state.workers.length, icon:"hardhat", tone:"info"},
    {label:"Low Stock Items", val:t.lowStock.length, icon:"alert", tone: t.lowStock.length>0?"danger":"success"},
    {label:"Pending Payments", val:money(t.pending), icon:"clock", tone:"warn"},
  ];
  const toneColor = {success:"var(--success)", danger:"var(--danger)", info:"var(--info)", accent:"var(--accent)", warn:"var(--warning)"};
  const toneBg = {success:"var(--success-soft)", danger:"var(--danger-soft)", info:"var(--info-soft)", accent:"var(--accent-soft)", warn:"var(--warning-soft)"};

  return `
    <div class="page-head">
      <div><div class="page-title">Dashboard</div><div class="page-sub">Live overview of your business, updated automatically.</div></div>
    </div>
    <div class="stat-grid">
      ${cards.map(c=>`
        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-icon" style="background:${toneBg[c.tone]};color:${toneColor[c.tone]}">${ICONS[c.icon]}</div>
          </div>
          <div class="stat-val">${c.val}</div>
          <div class="stat-label">${c.label}</div>
        </div>`).join("")}
    </div>
    <div class="dash-grid">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">${ICONS.alert} Low Stock Alerts</div></div>
        ${t.lowStock.length===0 ? emptyState("box","All stocked up","No products are below their low-stock threshold right now.") :
          `<div style="display:flex; flex-direction:column;">${t.lowStock.map(p=>`
            <div class="list-row">
              <div class="list-avatar">${ICONS.box}</div>
              <div style="flex:1;"><div style="font-weight:700;font-size:13px;">${escapeHtml(p.name)}</div><div style="font-size:11.5px;color:var(--ink-muted);">${escapeHtml(p.category)} · ${escapeHtml(p.subcategory||"")}</div></div>
              <span class="tag tag-danger">${p.stock} left</span>
            </div>`).join("")}</div>`}
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">${ICONS.clock} Recent Activity</div></div>
        ${state.activity.length===0 ? emptyState("clock","No activity yet","Actions you take across the app will show up here.") :
          state.activity.slice(0,10).map(a=>`
            <div class="activity-row">
              <div class="activity-dot"></div>
              <div><div class="activity-text">${escapeHtml(a.text)}</div><div class="activity-time">${timeAgo(a.date)}</div></div>
            </div>`).join("")}
      </div>
    </div>`;
}
function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff<60) return "just now";
  if(diff<3600) return Math.floor(diff/60)+"m ago";
  if(diff<86400) return Math.floor(diff/3600)+"h ago";
  return Math.floor(diff/86400)+"d ago";
}
function emptyState(icon,title,sub,actionHtml=""){
  return `<div class="empty-state">${ICONS[icon]||ICONS.box}<h3>${escapeHtml(title)}</h3><p>${escapeHtml(sub)}</p>${actionHtml}</div>`;
}

function renderInventory(){

    if(stockFilter==="low" && !(Number(p.stock)<=Number(p.lowStock||0))) return false;
    if(stockFilter==="out" && Number(p.stock)>0) return false;
    if(searchQuery && tab==="inventory"){} // search box drives global search, not local filter
    return true;
  });
  return `
    <div class="page-head">
      <div><div class="page-title">Inventory</div><div class="page-sub">${state.products.length} products across ${Object.keys(state.categories).length} categories.</div></div>

    `<div class="card-grid">${list.map(p=>productCard(p)).join("")}</div>`}

function productCard(p){
  const low = Number(p.stock) <= Number(p.lowStock||0);
  const out = Number(p.stock) <= 0;
  return `
    <div class="entity-card" data-product-open="${p.id}">
      <div>
        <div class="entity-title">${escapeHtml(p.name)}</div>
        <div class="entity-sub">${escapeHtml(p.category)}${p.subcategory?" · "+escapeHtml(p.subcategory):""}</div>
      </div>
      <div class="card-price-row">
        <span class="card-price">${money(p.sellingPrice)}</span>
        <span class="stock-pill" style="background:${out?'var(--danger-soft)':low?'var(--warning-soft)':'var(--success-soft)'}; color:${out?'var(--danger)':low?'var(--warning)':'var(--success)'}">${out?"Out of stock":p.stock+" in stock"}</span>
      </div>
    </div>`;

function openSellModal(preselectedProductId){
  openModal(`
    ${modalHeader("New Sale")}
    <div class="modal-body">
      <div class="form-field"><span>Customer <span style="color:var(--ink-faint); font-weight:400;">(optional)</span></span>
        <select class="select" id="f_customer">
          <option value="">— Walk-in customer —</option>
          ${state.customers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}
        </select>
      </div>
      <div class="form-field"><span>Product</span>
        <select class="select" id="f_product">
          <option value="">— Select product —</option>
          ${state.products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}" ${p.id===preselectedProductId?"selected":""}>${escapeHtml(p.name)} (${p.stock} in stock · ${money(p.sellingPrice)})</option>`).join("")}
        </select>
      </div>
      <div class="form-field"><span>Quantity</span><input class="input" type="number" min="1" id="f_qty" value="1" /></div>
      <div class="form-field"><span>Payment status</span>
        <div class="seg-toggle" id="paidToggle">
          <div class="seg-opt active" data-val="paid">${ICONS.check} Paid</div>
          <div class="seg-opt" data-val="unpaid">${ICONS.alert} Unpaid</div>
        </div>
      </div>
      <div id="saleSummary" style="font-size:13px; color:var(--ink-muted); padding:10px 0; font-weight:600;"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="genInvoiceBtn">${ICONS.file} Generate Invoice</button></div>
  `);
  let salePaid = true;
  if(!state.products.some(p=>p.stock>0)){
    document.getElementById("saleSummary").innerHTML = `<span style="color:var(--warning);">Add an in-stock product before creating a sale.</span>`;
  }
  document.querySelectorAll("#paidToggle .seg-opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      document.querySelectorAll("#paidToggle .seg-opt").forEach(x=>x.classList.remove("active"));
      el.classList.add("active");
      salePaid = el.dataset.val==="paid";
    });
  });
  function updateSummary(){
    const prod = state.products.find(p=>p.id===document.getElementById("f_product").value);
    const qty = +document.getElementById("f_qty").value||0;
    if(prod){
      document.getElementById("f_qty").max = prod.stock;
      document.getElementById("saleSummary").innerHTML = `Total: <strong>${money(prod.sellingPrice*qty)}</strong> · ${prod.stock} available`;
    }
  }
  document.getElementById("f_product").addEventListener("change", updateSummary);
  document.getElementById("f_qty").addEventListener("input", updateSummary);
  updateSummary();
  document.getElementById("genInvoiceBtn").addEventListener("click", ()=>{
    const custId = document.getElementById("f_customer").value;
    const prodId = document.getElementById("f_product").value;
    const qty = +document.getElementById("f_qty").value||0;
    if(!prodId || qty<1){ toast("Select a product and quantity", false); return; }
    const prod = state.products.find(p=>p.id===prodId);
    const cust = custId ? state.customers.find(c=>c.id===custId) : null;
    if(qty>prod.stock){ toast("Not enough stock available", false); return; }
    const total = prod.sellingPrice*qty;
    prod.stock -= qty;
    const paid = salePaid ? total : 0;
    const balance = total - paid;
    if(cust){
      cust.pending = Number(cust.pending||0) + balance;
      cust.paid = Number(cust.paid||0) + paid;
      cust.ledger = cust.ledger||[];
      cust.ledger.unshift({date: todayStr(), type:"sale", desc:`${qty} × ${prod.name}`, amount: total, paid, balance});
    }
    const invNum = "INV-" + (state.invoiceSeq++);
    const custName = cust ? cust.name : "Walk-in Customer";
    state.transactions.push({id:uid(), date:todayStr(), type:"revenue", category:"Sale", amount: total, note:`${invNum} — ${prod.name} × ${qty} to ${custName}`});
    const invoice = {id:uid(), number: invNum, date: todayStr(), customerId: cust?cust.id:null, customerName: custName,
      customerPhone: cust?cust.phone:"", category: prod.category, items:[{name:prod.name, qty, price:prod.sellingPrice, total}], total, paid: salePaid, paidAmount: paid, balance};
    state.invoices = state.invoices||[];
    state.invoices.unshift(invoice);
    logActivity(`Sold ${qty} × ${prod.name} to ${custName} for ${money(total)}`);
    saveState();
    closeModal();
    renderContent();
    toast("Sale recorded — inventory updated");
    openInvoicePreview(invoice);
  });
}

  state.invoices = state.invoices||[];

function openInvoicePreview(inv){
  const rowsHtml = inv.items.map(it=>`<tr><td>${escapeHtml(it.name)}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(it.total)}</td></tr>`).join("");
  openModal(`
    ${modalHeader("Invoice Preview")}
    <div class="modal-body">
      <div class="invoice-sheet" id="invoiceSheet">
        <div class="inv-head">
          <div><h2 style="font-family:var(--font-display);">${escapeHtml(state.settings.shopName)}</h2><div style="font-size:11.5px;color:#555;">Owner: ${escapeHtml(state.settings.ownerName)}</div></div>
          <div style="text-align:right; font-size:12px;"><div><strong>${inv.number}</strong></div><div>${fmtDate(inv.date)}</div></div>
        </div>
        <div style="font-size:12.5px; margin-bottom:6px;"><strong>Bill To:</strong> ${escapeHtml(inv.customerName||"Walk-in Customer")} ${inv.customerPhone?" · "+escapeHtml(inv.customerPhone):""}</div>
        <table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${rowsHtml}</tbody></table>
        <div style="text-align:right; margin-top:14px; font-size:13.5px;">
          <div>Total: <strong>${money(inv.total)}</strong></div>
          <div>Status: <strong style="color:${inv.paid?'#1f8a4c':'#c13f3f'}">${inv.paid?"Paid":"Unpaid"}</strong></div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="printInvBtn">${ICONS.print} Print</button>
      <button class="btn btn-primary" id="pdfInvBtn">${ICONS.download} Download PDF</button>
    </div>
  `, true);
  document.getElementById("printInvBtn").addEventListener("click", ()=>{
    const w = window.open("", "_blank");
    w.document.write(`<html><head><title>${inv.number}</title></head><body>${document.getElementById("invoiceSheet").outerHTML}</body></html>`);
    w.document.close(); w.focus(); setTimeout(()=>w.print(), 300);
  });
  document.getElementById("pdfInvBtn").addEventListener("click", ()=> downloadInvoicePDF(inv));
}
function downloadInvoicePDF(inv){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text(state.settings.shopName, 14, 18);
    doc.setFontSize(10); doc.text("Owner: " + state.settings.ownerName, 14, 25);
    doc.text(inv.number, 160, 18); doc.text(fmtDate(inv.date), 160, 25);
    doc.text("Bill To: " + (inv.customerName||"Walk-in Customer") + (inv.customerPhone?(" · "+inv.customerPhone):""), 14, 36);
    let y = 48;
    doc.setFontSize(9); doc.text("Product", 14, y); doc.text("Qty", 110, y); doc.text("Price", 135, y); doc.text("Total", 165, y);
    y += 5; doc.line(14, y, 196, y); y += 6;
    inv.items.forEach(it=>{
      doc.text(String(it.name).slice(0,38), 14, y); doc.text(String(it.qty), 110, y); doc.text(String(it.price), 135, y); doc.text(String(it.total), 165, y);
      y += 7;
    });
    y += 4; doc.line(14, y, 196, y); y += 8;
    doc.setFontSize(11);
    doc.text("Total: " + state.settings.currency + " " + inv.total, 140, y); y += 7;
    doc.text("Status: " + (inv.paid?"Paid":"Unpaid"), 140, y);
    doc.save(inv.number + ".pdf");
    toast("Invoice PDF downloaded");
  }catch(e){ toast("PDF generation failed — try Print instead", false); }
}

      <div class="form-row3" style="margin-top:8px;">

            <div style="display:flex; justify-content:space-between; align-items:center;">

            <div style="font-size:12px; color:var(--ink-muted); margin-top:8px; line-height:1.7;">
              ${l.workers?`👷 ${l.workers} worker${l.workers>1?'s':''}${l.workerWage?` × ${money(l.workerWage)} = ${money(l.workers*l.workerWage)}`:''}<br/>`:""}
              ${(l.machines&&l.machines.length)?`🚜 Machines: ${l.machines.map(m=>escapeHtml(m.name)+(m.cost?` (${money(m.cost)})`:'')).join(", ")}<br/>`:""}
              ${materialsList.length?`📦 Materials: ${materialsList.map(m=>escapeHtml(m.name)+(m.cost?` (${money(m.cost)})`:'')).join(", ")}<br/>`:""}
              ${l.otherExpenses?`Other expenses: ${money(l.otherExpenses)}<br/>`:""}

              ${l.notes?`<br/>Notes: ${escapeHtml(l.notes)}`:""}
            </div>
            ${l.photos && l.photos.length ? `<div class="photo-grid" style="margin-top:10px; grid-template-columns:repeat(auto-fill,minmax(84px,1fr));">${l.photos.map((ph,pi)=>`
              <div>
                <div class="photo-thumb" data-site-lightbox="${li}:${pi}"><img src="${ph.data}"/></div>
                ${ph.description?`<div style="font-size:10.5px; color:var(--ink-muted); margin-top:4px; line-height:1.3;">${escapeHtml(ph.description)}</div>`:""}

        </div>
        <div class="form-row">
          <div class="form-field"><span>Tender value</span><input class="input" type="number" id="f_tender" value="${s.tenderValue}" /></div>
          <div class="form-field"><span>Current cost</span><input class="input" type="number" id="f_cost" value="${s.currentCost}" /></div>

      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveBtn">${ICONS.check} Save Changes</button></div>
    `);
    document.getElementById("saveBtn").addEventListener("click", ()=>{
      s.name=document.getElementById("f_name").value.trim()||s.name; s.client=document.getElementById("f_client").value.trim();
      s.location=document.getElementById("f_location").value.trim(); s.tenderValue=+document.getElementById("f_tender").value||0;
      s.currentCost=+document.getElementById("f_cost").value||0; s.expectedCompletion=document.getElementById("f_completion").value;
      saveState(); closeModal(); openSiteDetail(id); toast("Site updated");

      openLightbox(photos, pi);
    });

}
function openAddSiteLogModal(id){
  const s = state.sites.find(x=>x.id===id); if(!s) return;
  openModal(`
    ${modalHeader("Add Today's Log")}
    <div class="modal-body">
      <div class="form-row">
        <div class="form-field"><span>Date</span><input class="input" type="date" id="f_date" value="${todayStr()}" /></div>
        <div class="form-field"><span>Progress (%)</span><input class="input" type="number" min="0" max="100" id="f_progress" value="${s.progress||0}" /></div>
      </div>

      <div class="panel-title" style="margin:14px 0 8px; font-size:12.5px;">Workers</div>
      <div class="form-row">
        <div class="form-field"><span>Workers present</span><input class="input" type="number" min="0" id="f_workers" value="0" /></div>
        <div class="form-field"><span>Daily wage per worker (${state.settings.currency})</span><input class="input" type="number" min="0" id="f_workerWage" value="0" /></div>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px;">
        <div class="panel-title" style="font-size:12.5px;">Machines used</div>
        <button type="button" class="btn btn-sm btn-ghost" id="addMachineBtn">${ICONS.plus} Add machine</button>
      </div>
      <div id="machineRows"></div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px;">
        <div class="panel-title" style="font-size:12.5px;">Materials used</div>
        <button type="button" class="btn btn-sm btn-ghost" id="addMaterialBtn">${ICONS.plus} Add material</button>
      </div>
      <div id="materialRows"></div>

      <div class="form-field" style="margin-top:12px;"><span>Other expenses <span style="color:var(--ink-faint); font-weight:400;">(optional — fuel, transport, misc)</span></span><input class="input" type="number" min="0" id="f_otherExpenses" value="0" /></div>

      <div class="panel" style="margin-top:14px; padding:12px; background:var(--accent-soft);">
        <div class="entity-sub">Today's total expense (auto-calculated)</div>
        <div id="totalExpensePreview" style="font-size:19px; font-weight:800; margin-top:2px;">${money(0)}</div>
      </div>

      <div class="form-field" style="margin-top:12px;"><span>Notes</span><textarea class="textarea" id="f_notes" placeholder="Anything else about today"></textarea></div>
      <div class="form-field"><span>Photos</span><div class="photo-grid" id="logPhotoGrid"></div></div>
      <input type="file" id="logPhotoInput" accept="image/*" multiple style="display:none" />
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="saveLogBtn">${ICONS.check} Save Log</button></div>
  `, true);

  const tempPhotos = [];
  let materials = [{name:"", cost:0}];
  let machines = [{name:"", cost:0}];

  function renderRows(containerId, rows, nameAttr, costAttr, delAttr, placeholder){
    const wrap = document.getElementById(containerId);
    wrap.innerHTML = rows.map((m,i)=>`
      <div class="form-row" style="align-items:end; margin-bottom:6px;">
        <div class="form-field" style="margin:0;"><input class="input" placeholder="${placeholder}" data-${nameAttr}="${i}" value="${escapeHtml(m.name)}" /></div>
        <div class="form-field" style="margin:0; display:flex; gap:6px;">
          <input class="input" type="number" min="0" placeholder="Cost" data-${costAttr}="${i}" value="${m.cost||0}" style="flex:1;" />
          ${rows.length>1?`<button type="button" class="btn btn-ghost btn-sm" data-${delAttr}="${i}" style="padding:0 10px;">${ICONS.x}</button>`:""}
        </div>
      </div>`).join("");
    wrap.querySelectorAll(`[data-${nameAttr}]`).forEach(el=> el.addEventListener("input", ()=>{ rows[+el.dataset[nameAttr]].name = el.value; }));
    wrap.querySelectorAll(`[data-${costAttr}]`).forEach(el=> el.addEventListener("input", ()=>{ rows[+el.dataset[costAttr]].cost = +el.value||0; updateTotal(); }));
    wrap.querySelectorAll(`[data-${delAttr}]`).forEach(el=> el.addEventListener("click", ()=>{ rows.splice(+el.dataset[delAttr],1); renderRows(containerId, rows, nameAttr, costAttr, delAttr, placeholder); updateTotal(); }));
  }
  function renderMaterials(){ renderRows("materialRows", materials, "mname", "mcost", "mdel", "e.g. Cement (40 bags)"); }
  function renderMachines(){ renderRows("machineRows", machines, "kname", "kcost", "kdel", "e.g. JCB Excavator"); }
  document.getElementById("addMaterialBtn").addEventListener("click", ()=>{ materials.push({name:"", cost:0}); renderMaterials(); });
  document.getElementById("addMachineBtn").addEventListener("click", ()=>{ machines.push({name:"", cost:0}); renderMachines(); });
  renderMaterials();
  renderMachines();

  function updateTotal(){
    const workers = +document.getElementById("f_workers").value||0;
    const workerWage = +document.getElementById("f_workerWage").value||0;
    const other = +document.getElementById("f_otherExpenses").value||0;
    const materialsCost = materials.reduce((s,m)=>s+Number(m.cost||0),0);
    const machinesCost = machines.reduce((s,m)=>s+Number(m.cost||0),0);
    const total = (workers*workerWage) + machinesCost + materialsCost + other;
    document.getElementById("totalExpensePreview").textContent = money(total);
    return total;
  }
  ["f_workers","f_workerWage","f_otherExpenses"].forEach(fid=>{
    document.getElementById(fid).addEventListener("input", updateTotal);
  });
  updateTotal();

  function renderGrid(){
    const grid = document.getElementById("logPhotoGrid");
    grid.innerHTML = tempPhotos.map((p,i)=>`
      <div class="photo-thumb-desc">
        <div class="photo-thumb"><img src="${p.data}"/><div class="rm" data-rm="${i}">✕</div></div>
        <input class="input" style="margin-top:6px; font-size:11.5px; padding:6px 8px;" placeholder="Describe this photo (e.g. 'Wall plastering done today')" data-pdesc="${i}" value="${escapeHtml(p.description||"")}" />
      </div>`).join("") +
      `<div class="photo-add" id="logPhotoAddBtn">${ICONS.camera}<span>Add</span></div>`;
    grid.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click", ()=>{ tempPhotos.splice(+b.dataset.rm,1); renderGrid(); }));
    grid.querySelectorAll("[data-pdesc]").forEach(inp=>inp.addEventListener("input", ()=>{ tempPhotos[+inp.dataset.pdesc].description = inp.value; }));
    document.getElementById("logPhotoAddBtn").addEventListener("click", ()=>document.getElementById("logPhotoInput").click());
  }
  renderGrid();
  document.getElementById("logPhotoInput").addEventListener("change",(e)=>{
    [...e.target.files].forEach(f=>{ const r=new FileReader(); r.onload=()=>{ tempPhotos.push({data:r.result, description:""}); renderGrid(); }; r.readAsDataURL(f); });
    e.target.value="";
  });
  document.getElementById("saveLogBtn").addEventListener("click", ()=>{
    const workers = +document.getElementById("f_workers").value||0;
    const workerWage = +document.getElementById("f_workerWage").value||0;
    const other = +document.getElementById("f_otherExpenses").value||0;
    const cleanMaterials = materials.filter(m=>m.name.trim()||m.cost>0);
    const cleanMachines = machines.filter(m=>m.name.trim()||m.cost>0);
    const materialsCost = cleanMaterials.reduce((s,m)=>s+Number(m.cost||0),0);
    const machinesCost = cleanMachines.reduce((s,m)=>s+Number(m.cost||0),0);
    const totalExpense = (workers*workerWage) + machinesCost + materialsCost + other;
    const log = {date:document.getElementById("f_date").value||todayStr(), progress:+document.getElementById("f_progress").value||0,
      workers, workerWage, machines: cleanMachines, machinesCost, materials: cleanMaterials, materialsCost, otherExpenses: other,
      expenses: totalExpense, notes:document.getElementById("f_notes").value.trim(), photos:tempPhotos.slice()};
    s.dailyLogs.unshift(log);
    s.progress = log.progress;
    s.currentCost = Number(s.currentCost||0) + Number(log.expenses||0);
    if(log.expenses>0) state.transactions.push({id:uid(), date:log.date, type:"expense", category:"Site Expense", amount: log.expenses, note:`${s.name} — daily log expense`, siteId:s.id});
    logActivity(`Logged progress for site "${s.name}" (${log.progress}%)`);
    saveState(); closeModal(); openSiteDetail(id); renderContent(); toast("Daily log saved");
  });
}

}
function drawGroupedBarChart(canvas, labels, seriesA, seriesB, colorA, colorB){
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||600, h = 220;
  canvas.width = w*dpr; canvas.height = h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(...seriesA, ...seriesB, 1);
  const padL = 8, padB = 24, padT = 10, plotW = w-padL-8, plotH = h-padB-padT;
  const groupW = plotW/labels.length;
  const inkFaint = getComputedStyle(document.documentElement).getPropertyValue('--ink-faint').trim() || "#888";
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-solid').trim();
  ctx.beginPath(); ctx.moveTo(padL, padT+plotH); ctx.lineTo(padL+plotW, padT+plotH); ctx.stroke();
  labels.forEach((lab,i)=>{
    const gx = padL + i*groupW;
    const barW = groupW*0.28;
    const av = seriesA[i]/max*plotH, bv = seriesB[i]/max*plotH;
    ctx.fillStyle = colorA;
    ctx.fillRect(gx + groupW*0.18, padT+plotH-av, barW, av);
    ctx.fillStyle = colorB;
    ctx.fillRect(gx + groupW*0.54, padT+plotH-bv, barW, bv);
    ctx.fillStyle = inkFaint; ctx.font = "10px Inter, sans-serif"; ctx.textAlign="center";
    ctx.fillText(lab, gx+groupW/2, h-6);
  });
}
function drawDonut(canvas, labels, values, colors){
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||600, h = 220;
  canvas.width = w*dpr; canvas.height = h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const total = values.reduce((a,b)=>a+b,0);
  const cx = 70, cy = h/2, r = 62, rin = 38;
  if(total<=0){
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-faint').trim();
    ctx.font = "12px Inter, sans-serif"; ctx.textAlign="center"; ctx.fillText("No data yet", w/2, h/2);
    return;
  }
  let start = -Math.PI/2;
  values.forEach((v,i)=>{
    const angle = v/total*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+angle); ctx.closePath();
    ctx.fillStyle = colors[i%colors.length]; ctx.fill();
    start += angle;
  });
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath(); ctx.arc(cx,cy,rin,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  let ly = 26;
  labels.forEach((lab,i)=>{
    ctx.fillStyle = colors[i%colors.length]; ctx.fillRect(150, ly-8, 9, 9);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    ctx.font="11px Inter, sans-serif"; ctx.textAlign="left"; ctx.fillText(lab, 164, ly);
    ly += 18;
  });
}
function renderAnalyticsCharts(){
  const monthlyCanvas = document.getElementById("chartMonthly");
  if(monthlyCanvas){
    const months = [];
    for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
    const rev = months.map(m=> state.transactions.filter(t=>t.type==="revenue"&&t.date.startsWith(m)).reduce((s,t)=>s+Number(t.amount),0));
    const exp = months.map(m=> state.transactions.filter(t=>t.type==="expense"&&t.date.startsWith(m)).reduce((s,t)=>s+Number(t.amount),0));
    const labels = months.map(m=> new Date(m+"-01").toLocaleDateString(undefined,{month:"short"}));
    const cs = getComputedStyle(document.documentElement);
    drawGroupedBarChart(monthlyCanvas, labels, rev, exp, cs.getPropertyValue('--success').trim(), cs.getPropertyValue('--danger').trim());
  }
  const invCanvas = document.getElementById("chartInventory");
  if(invCanvas){
    const cats = Object.keys(state.categories);
    const values = cats.map(c=> state.products.filter(p=>p.category===c).reduce((s,p)=>s+Number(p.stock)*Number(p.sellingPrice||0),0));
    const palette = ["#ef7d1a","#4fb56a","#4f9fd6","#e0a72b","#e5595a","#7d8fce"];
    drawDonut(invCanvas, cats, values, palette);
  }
}

function handleRestoreFile(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const parsed = JSON.parse(r.result);
      state = Object.assign(structuredCloneSafe(DEFAULT_STATE), parsed, {settings: Object.assign({}, DEFAULT_STATE.settings, parsed.settings||{})});
      saveState();
      document.documentElement.setAttribute("data-theme", state.settings.theme);
      renderOwnerShop(); renderLogoBadge(); renderNav(); renderContent();
      toast("Backup restored");
    }catch(err){ toast("Invalid backup file", false); }
  };
  r.readAsText(file);
  e.target.value = "";
}

/* ============== GLOBAL SEARCH ============== */
function runSearch(q){
  const box = document.getElementById("searchResults");
  if(!q){ hideSearchResults(); return; }
  const ql = q.toLowerCase();
  const results = {
    Products: state.products.filter(p=>p.name.toLowerCase().includes(ql)).slice(0,5).map(p=>({label:p.name, sub:p.category, open:()=>openProductDetail(p.id)})),
    Customers: state.customers.filter(c=>c.name.toLowerCase().includes(ql)||(c.phone||"").includes(ql)).slice(0,5).map(c=>({label:c.name, sub:c.phone||"", open:()=>openCustomerDetail(c.id)})),
    Suppliers: state.suppliers.filter(s=>s.company.toLowerCase().includes(ql)).slice(0,5).map(s=>({label:s.company, sub:s.contact||"", open:()=>openSupplierDetail(s.id)})),
    "Construction Sites": state.sites.filter(s=>s.name.toLowerCase().includes(ql)).slice(0,5).map(s=>({label:s.name, sub:s.location||"", open:()=>openSiteDetail(s.id)})),
    Workers: state.workers.filter(w=>w.name.toLowerCase().includes(ql)).slice(0,5).map(w=>({label:w.name, sub:w.skill||"", open:()=>openWorkerDetail(w.id)})),
  };
  const groups = Object.entries(results).filter(([,v])=>v.length>0);
  if(groups.length===0){ box.innerHTML = `<div class="sr-empty">No results for "${escapeHtml(q)}"</div>`; box.classList.add("show"); return; }
  box.innerHTML = groups.map(([label,items])=>`
    <div class="sr-group-label">${label}</div>
    ${items.map((it,i)=>`<div class="sr-item" data-sr="${label}:${i}"><div class="list-avatar" style="width:26px;height:26px;font-size:10px;">${escapeHtml(it.label).slice(0,2).toUpperCase()}</div><div><div style="font-weight:600;">${escapeHtml(it.label)}</div><div style="font-size:11px; color:var(--ink-muted);">${escapeHtml(it.sub)}</div></div></div>`).join("")}
  `).join("");
  box.classList.add("show");
  box.querySelectorAll("[data-sr]").forEach(el=>{
    const [label,i] = el.dataset.sr.split(":");
    el.addEventListener("click", ()=>{ results[label][+i].open(); hideSearchResults(); });
  });
}
function hideSearchResults(){ document.getElementById("searchResults").classList.remove("show"); }

/* ============== BIND PAGE-LEVEL EVENTS (per render) ============== */
function bindPageEvents(){
  document.querySelectorAll("[data-product-open]").forEach(el=> el.addEventListener("click", ()=>openProductDetail(el.dataset.productOpen)));
  document.querySelectorAll("[data-customer-open]").forEach(el=> el.addEventListener("click", ()=>openCustomerDetail(el.dataset.customerOpen)));
  document.querySelectorAll("[data-supplier-open]").forEach(el=> el.addEventListener("click", ()=>openSupplierDetail(el.dataset.supplierOpen)));
  document.querySelectorAll("[data-site-open]").forEach(el=> el.addEventListener("click", ()=>openSiteDetail(el.dataset.siteOpen)));
  document.querySelectorAll("[data-worker-open]").forEach(el=> el.addEventListener("click", ()=>openWorkerDetail(el.dataset.workerOpen)));
  document.querySelectorAll("[data-cat]").forEach(el=> el.addEventListener("click", ()=>{ invCategoryFilter = el.dataset.cat; renderContent(); }));
  document.querySelectorAll("[data-invcat]").forEach(el=> el.addEventListener("click", ()=>{ invoiceFilter = el.dataset.invcat; renderContent(); }));
  document.querySelectorAll("[data-invoice-open]").forEach(el=> el.addEventListener("click", ()=>{
    const inv = state.invoices.find(x=>x.id===el.dataset.invoiceOpen); if(inv) openInvoicePreview(inv);
  }));
  document.querySelectorAll("[data-stock]").forEach(el=> el.addEventListener("click", ()=>{ stockFilter = el.dataset.stock; renderContent(); }));
  document.querySelectorAll("[data-del-tx]").forEach(el=> el.addEventListener("click", ()=>{
    const id = el.dataset.delTx; const tr = state.transactions.find(x=>x.id===id);
    confirmDelete(`Remove this ${tr.type} of ${money(tr.amount)}?`, ()=>{ state.transactions = state.transactions.filter(x=>x.id!==id); saveState(); renderContent(); toast("Transaction removed"); });
  }));
  document.querySelectorAll(".theme-tile").forEach(el=> el.addEventListener("click", ()=> setTheme(el.dataset.themeId)));
  const saveSet = document.getElementById("saveSettingsBtn");
  if(saveSet) saveSet.addEventListener("click", ()=>{
    state.settings.ownerName = document.getElementById("s_owner").value.trim()||state.settings.ownerName;
    state.settings.shopName = document.getElementById("s_shop").value.trim()||state.settings.shopName;
    state.settings.currency = document.getElementById("s_currency").value.trim()||state.settings.currency;
    saveState(); renderOwnerShop(); renderContent(); toast("Settings saved");
  });
  const resetBtn = document.getElementById("resetAllBtn");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    confirmDelete("This will permanently erase ALL data — products, customers, suppliers, sites, workers and transactions.", ()=>{
      const keepSettings = {...state.settings};
      state = structuredCloneSafe(DEFAULT_STATE); state.settings = keepSettings;
      saveState(); renderContent(); toast("All data reset");
    });
  });
  if(tab==="analytics") renderAnalyticsCharts();
}

window.addEventListener("resize", ()=>{ if(tab==="analytics") renderAnalyticsCharts(); });
window.addEventListener("DOMContentLoaded", init);
</script>
